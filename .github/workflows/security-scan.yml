name: "🛡️ Enterprise AppSec Code Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: "SAST & Secret Discovery Pipeline"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Initialize Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Execute Bandit SAST Engine
      run: |
        pip install bandit
        bandit -r target-infrastructure/ attack-box/ -ll --exit-zero

    # ✅ FIXED: Pointing directly to the correct repository asset location
    - name: Secret Leak Check (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        extra_args: --only-verified

